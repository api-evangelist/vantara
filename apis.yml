description: >-
  Milana (formerly Vantara, a Homebrew-backed AI startup) is "the AI product
  engineer" — it records user sessions through a lightweight open-source
  browser SDK (milana-js) and uses vision AI to watch the replays, understand
  what users came to do and whether they succeeded, and surface friction that
  traditional analytics miss. Beyond the dashboard it exposes a hosted remote
  MCP server so Claude, Cursor, ChatGPT, and other agents can search sessions,
  trace user journeys, and run analyses, plus a GitHub codebase integration
  that lets the Milana agent read code alongside session data and open pull
  requests that ship fixes.
